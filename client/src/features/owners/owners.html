<div class="card bg-base-100 w1/2 mx-auto p-10 mt-10 shadow-xl">
  <h1 class="text-3xl text-blue-500">{{title}}!!</h1>
  <ul class="list">
    @for (owner of owners(); track owner.id) {
      <li class="list-row items-center">
        <img src="/user.png" alt="user avatar" class="size-12 rounded-box">
        <div>
          {{owner.displayName}}
        </div>
      </li>
    }
    <button class="btn btn-primary" (click)="setOwners()">getowners</button>
  </ul>
</div>
