<div class="card bg-base-100 w1/2 mx-auto p-10 mt-10 shadow-xl">
  <h1 class="text-3xl text-blue-500">data!!</h1>
  <ul class="list">
    @for (owner of owners$ | async; track owner.id) {
      <li class="list-row items-center">
        <img src="/user.png" alt="user avatar" class="size-12 rounded-box">
        <div>
          {{owner.displayName}}
        </div>
      </li>
    }
  </ul>
</div>


<form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register(registerForm.value)">

  <input type="text" class="input w-full" name="displayName"
  ngModel
          placeholder="Display name">

  

  <datalist id="membersList">
    @for (owner of owners$ |async; track owner.id){
      <option [value]="owner.displayName">{{owner.displayName}}</option>
    }
  </datalist>

  <div class="flex items-center justify-end gap-3">
    <button class="btn btn-primary" type="submit">Register</button>
  </div>
</form>
