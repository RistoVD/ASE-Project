<header class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black">
  <div class="flex algin-middle items-center px-10 mx-auto gap-6">
    <div class="text-white">
      <a routerLink="/"
         routerLinkActive="text-accent"
         [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center gap-3 max-h-16 uppercase text-lg  border-r-white border-r-2 pr-6">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
          <path d="M11.47 3.841a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.061l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 1 0 1.061 1.06l8.69-8.689Z" />
          <path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z" />
        </svg>

        <h3 class="text-2xl font-semibold  uppercase">StallR</h3>
      </a>
    </div>

    <nav class="flex gap-3 my-2 uppercase text-lg text-white">
      <a routerLink="/owners" routerLinkActive="text-accent">Owners</a>
      <a routerLink="/vehicles" routerLinkActive="text-accent">Vehicles</a>
      <a routerLink="/prices" routerLinkActive="text-accent">Prices</a>
    </nav>
    <div class="flex align-middle ml-auto gap-3">
      @if(accountService.currentUser();as user){
        <div class="dropdown dropdown-end" >
          <div tabindex="0" role="button"
               class="flex items-center text-white text-xl gap-3 cursor-pointer">
            <img src="/user.png" alt="user avatar" class="w-8 h-8 rounded-full">
            <span>{{ user.displayName }}</span>
            </div>
          <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
            <li><a>Edit profile</a></li>
            <li><a (click)="logout()"> Logout</a></li>
          </ul>
        </div>
      } @else {
        <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-3">
          <input
            [(ngModel)]="creds.email"
            name="email"
            type="text"
            class="input"
            placeholder="Email">
          <input
            [(ngModel)]="creds.password"
            name="password"
            type="password"
            class="input"
            placeholder="Password">
          <button type="submit" class="btn">Login</button>
        </form>
      }



    </div>

  </div>
</header>
